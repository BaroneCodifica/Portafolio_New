<header class="bg-slate-800 border-b border-slate-700/60">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-cyan-400">Panel de Control</h1>
        <a href="{% url 'core:index' %}" class="text-sm text-slate-300 hover:text-white transition-colors flex items-center gap-1">
            Ver Sitio Público &rarr;
        </a>
    </div>

    <!-- NAVEGACIÓN POR PESTAÑAS (TABS) -->
    <div class="max-w-6xl mx-auto px-6 flex gap-2 border-t border-slate-700/40 pt-2">
        
        <!-- Pestaña 1: Proyectos (CRUD) -->
        <a href="{% url 'core:dashboard_projects' %}" 
           class="px-4 py-2.5 text-sm font-semibold rounded-t-lg transition-colors flex items-center gap-2 border-b-2 
           {% if active_tab == 'projects' %}
               bg-slate-900 text-cyan-400 border-cyan-400
           {% else %}
               text-slate-400 hover:text-slate-200 border-transparent hover:border-slate-700
           {% endif %}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Proyectos
        </a>

        <!-- Pestaña 2: Cursos (CRUD) -->
        <a href="{% url 'core:dashboard_courses' %}" 
            class="px-4 py-2.5 text-sm font-semibold rounded-t-lg transition-colors flex items-center gap-2 border-b-2 
            {% if active_tab == 'courses' %}bg-slate-900 text-cyan-400 border-cyan-400{% else %}text-slate-400 hover:text-slate-200 border-transparent{% endif %}">
            Cursos
        </a>

        <!-- Pestaña 3: Métricas -->
        <a href="{% url 'core:dashboard_metrics' %}" 
           class="px-4 py-2.5 text-sm font-semibold rounded-t-lg transition-colors flex items-center gap-2 border-b-2 
           {% if active_tab == 'metrics' %}
               bg-slate-900 text-cyan-400 border-cyan-400
           {% else %}
               text-slate-400 hover:text-slate-200 border-transparent hover:border-slate-700
           {% endif %}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Métricas
        </a>

        <!-- En el futuro podrás añadir aquí más pestañas fácilmente -->
    </div>
</header>
