<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Programador Full-Stack</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CDN de HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header / Hero Section -->
    <header class="max-w-6xl mx-auto px-6 py-16 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">
            ¡Hola! Soy Programador Full-Stack
        </h1>
        <p class="mt-4 text-slate-400 text-lg max-w-2xl mx-auto">
            Bienvenido a mi portafolio digital. Explora mis proyectos filtrando por tecnología o palabra clave en tiempo real.
        </p>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-6 pb-20">
        
        <!-- Buscador Dinámico con HTMX -->
        <div class="mb-10 max-w-lg mx-auto">
            <div class="relative">
                <input 
                    type="text" 
                    name="search" 
                    placeholder="Buscar por tecnología (ej: Django, Python, React)..."
                    class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-cyan-500 transition-colors"
                    hx-get="{% url 'core:search_projects' %}"
                    hx-trigger="keyup changed delay:300ms, search"
                    hx-target="#projects-grid"
                    hx-indicator="#loading-spinner"
                >
                <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                
                <!-- Indicador de Carga (Spinner) -->
                <div id="loading-spinner" class="htmx-indicator absolute right-3.5 top-3.5">
                    <svg class="animate-spin h-5 w-5 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-slate-200 mb-8 border-b border-slate-800 pb-3">Proyectos</h2>
        
        <!-- Rejilla que se actualizará con HTMX -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% include 'core/project_list.html' %}
        </div>
    </main>

</body>
</html>
