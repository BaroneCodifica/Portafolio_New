<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 max-w-lg w-full rounded-xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-white">Editar Proyecto: {{ project.title }}</h3>
            <button onclick="document.getElementById('modal-container').innerHTML = ''" class="text-slate-400 hover:text-white">&times;</button>
        </div>

        <form 
            hx-post="{% url 'core:edit_project' project.id %}" 
            hx-target="#crud-table-body"
            hx-encoding="multipart/form-data"
            class="space-y-4"
            hx-on::after-request="if(event.detail.successful) document.getElementById('modal-container').innerHTML = ''"
        >
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}

            <div class="flex gap-3 pt-4">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-sm font-semibold">
                    Cancelar
                </button>
                <button type="submit" class="w-1/2 bg-cyan-600 hover:bg-cyan-500 text-white py-2 rounded-lg text-sm font-semibold">
                    Actualizar
                </button>
            </div>
        </form>
    </div>
</div>
